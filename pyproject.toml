[project]
name = "bike-view"
version = "0.1.0"
description = "A personal bike directory app to track bikes you own and have owned. Includes maintenance records, images, and tags."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pillow>=11",
    "aiosqlite>=0.20",
]
