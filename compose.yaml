services:
  bike-view:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - bike-data:/app/data
      - bike-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bike-data:
  bike-uploads:
